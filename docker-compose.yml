services:
  postgres:
    image: postgres:16.3-alpine
    container_name: myvpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myvpn
      POSTGRES_USER: myvpn
      POSTGRES_PASSWORD: myvpn
    ports:
      - "5454:5432"
    volumes:
      - myvpn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myvpn -d myvpn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myvpn-postgres-data:
