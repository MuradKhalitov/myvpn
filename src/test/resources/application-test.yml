spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

payment:
  provider: fake
  pending-ttl: 1h
  return-url: https://example.invalid/payment-return
  allow-fake: true
  verification:
    min-interval: 1ns
    max-clock-skew: 5m

vpn:
  provider:
    allow-fake: true
