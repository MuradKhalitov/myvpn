databaseChangeLog:
  - changeSet:
      id: 006-fence-subscription-recovery
      author: myvpn
      changes:
        - addColumn:
            tableName: subscriptions
            columns:
              - column:
                  name: provisioning_claim_token
                  type: uuid
        - dropIndex:
            tableName: subscriptions
            indexName: uk_subscriptions_current_user
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_subscriptions_current_user
              ON subscriptions (user_id)
              WHERE status IN (
                'PENDING',
                'RECONCILIATION_REQUIRED',
                'MANUAL_REVIEW_REQUIRED',
                'ACTIVE'
              )
      rollback:
        - sql:
            splitStatements: false
            sql: >
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM subscriptions
                  WHERE status = 'MANUAL_REVIEW_REQUIRED'
                ) THEN
                  RAISE EXCEPTION
                    'Rollback 006 requires manual resolution of MANUAL_REVIEW_REQUIRED subscriptions';
                END IF;
              END
              $$;
        - dropIndex:
            tableName: subscriptions
            indexName: uk_subscriptions_current_user
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_subscriptions_current_user
              ON subscriptions (user_id)
              WHERE status IN ('PENDING', 'RECONCILIATION_REQUIRED', 'ACTIVE')
        - dropColumn:
            tableName: subscriptions
            columnName: provisioning_claim_token
