databaseChangeLog:
  - changeSet:
      id: 017-add-device-identities
      author: myvpn
      changes:
        - sql: { sql: "ALTER TABLE account_identities DROP CONSTRAINT chk_account_identities_type" }
        - sql: { sql: "ALTER TABLE account_identities ADD CONSTRAINT chk_account_identities_type CHECK (type IN ('TELEGRAM', 'EMAIL', 'DEVICE'))" }
        - createTable:
            tableName: device_credentials
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: identity_id, type: uuid, constraints: { nullable: false } }
              - column: { name: secret_hash, type: varchar(64), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: last_used_at, type: timestamp with time zone }
              - column: { name: revoked_at, type: timestamp with time zone }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: device_credentials, baseColumnNames: identity_id, referencedTableName: account_identities, referencedColumnNames: id, constraintName: fk_device_credentials_identity }
        - addUniqueConstraint: { tableName: device_credentials, columnNames: identity_id, constraintName: uk_device_credentials_identity }
      rollback:
        - dropTable: { tableName: device_credentials }
        - sql: { sql: "ALTER TABLE account_identities DROP CONSTRAINT chk_account_identities_type" }
        - sql: { sql: "ALTER TABLE account_identities ADD CONSTRAINT chk_account_identities_type CHECK (type IN ('TELEGRAM', 'EMAIL'))" }
