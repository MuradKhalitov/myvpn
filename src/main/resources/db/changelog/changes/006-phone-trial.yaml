databaseChangeLog:
  - changeSet:
      id: 006-phone-trial
      author: myvpn
      changes:
        - sql:
            sql: |
              ALTER TABLE accounts ADD COLUMN trial_started_at timestamptz;
              ALTER TABLE accounts ADD COLUMN trial_expires_at timestamptz;
              ALTER TABLE accounts ADD COLUMN trial_granted_at timestamptz;
              ALTER TABLE account_identities DROP CONSTRAINT account_identities_type_check;
              ALTER TABLE account_identities ADD CONSTRAINT account_identities_type_check
                CHECK (type IN ('DEVICE','EMAIL','PHONE'));
              ALTER TABLE vpn_accesses DROP CONSTRAINT vpn_accesses_desired_entitlement_check;
              ALTER TABLE vpn_accesses ADD CONSTRAINT vpn_accesses_desired_entitlement_check
                CHECK (desired_entitlement IN ('FREE','TRIAL','PREMIUM','EXPIRED'));
              ALTER TABLE vpn_accesses DROP CONSTRAINT vpn_accesses_applied_entitlement_check;
              ALTER TABLE vpn_accesses ADD CONSTRAINT vpn_accesses_applied_entitlement_check
                CHECK (applied_entitlement IS NULL OR applied_entitlement IN ('FREE','TRIAL','PREMIUM','EXPIRED'));
              CREATE TABLE phone_verifications (
                id uuid PRIMARY KEY,
                phone varchar(16) NOT NULL,
                provider varchar(32) NOT NULL,
                provider_check_id varchar(128) NOT NULL UNIQUE,
                status varchar(16) NOT NULL CHECK (status IN ('PENDING','VERIFIED','EXPIRED','FAILED')),
                created_at timestamptz NOT NULL,
                expires_at timestamptz NOT NULL,
                verified_at timestamptz,
                account_id uuid REFERENCES accounts(id),
                exchange_token_hash varchar(128),
                exchange_expires_at timestamptz,
                exchange_consumed_at timestamptz,
                version bigint NOT NULL DEFAULT 0
              );
              CREATE INDEX idx_phone_verifications_phone_created ON phone_verifications(phone, created_at DESC);
