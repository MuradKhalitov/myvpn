databaseChangeLog:
  - changeSet:
      id: 013-add-accounts-and-identities
      author: myvpn
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: status, type: varchar(16), constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
        - sql:
            sql: >
              ALTER TABLE accounts
              ADD CONSTRAINT chk_accounts_status
              CHECK (status IN ('ACTIVE', 'BLOCKED', 'DELETED'))
        - sql:
            sql: >
              INSERT INTO accounts (id, status, version, created_at, updated_at)
              SELECT id, 'ACTIVE', 0, created_at, updated_at
              FROM telegram_users
        - createTable:
            tableName: account_identities
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: account_id, type: uuid, constraints: { nullable: false } }
              - column: { name: type, type: varchar(16), constraints: { nullable: false } }
              - column: { name: subject, type: varchar(320), constraints: { nullable: false } }
              - column: { name: normalized_subject, type: varchar(320), constraints: { nullable: false } }
              - column: { name: verified_at, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: account_identities
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_account_identities_account
        - addUniqueConstraint:
            tableName: account_identities
            columnNames: type,normalized_subject
            constraintName: uk_account_identities_type_subject
        - addUniqueConstraint:
            tableName: account_identities
            columnNames: account_id,type
            constraintName: uk_account_identities_account_type
        - createIndex:
            tableName: account_identities
            indexName: idx_account_identities_account
            columns:
              - column: { name: account_id }
        - sql:
            sql: >
              ALTER TABLE account_identities
              ADD CONSTRAINT chk_account_identities_type
              CHECK (type IN ('TELEGRAM', 'EMAIL'))
        - sql:
            sql: >
              INSERT INTO account_identities
                (id, account_id, type, subject, normalized_subject,
                 verified_at, created_at, updated_at, version)
              SELECT gen_random_uuid(), id, 'TELEGRAM', telegram_id::text,
                     telegram_id::text, created_at, created_at, updated_at, 0
              FROM telegram_users
        - addForeignKeyConstraint:
            baseTableName: telegram_users
            baseColumnNames: id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_telegram_users_account
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: telegram_users
            constraintName: fk_telegram_users_account
        - dropTable:
            tableName: account_identities
        - dropTable:
            tableName: accounts
