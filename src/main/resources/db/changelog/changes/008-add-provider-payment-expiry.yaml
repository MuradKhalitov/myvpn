databaseChangeLog:
  - changeSet:
      id: 008-add-provider-payment-expiry
      author: myvpn
      changes:
        - addColumn:
            tableName: payment_orders
            columns:
              - column:
                  name: provider_expires_at
                  type: timestamptz
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: payment_orders
            columnName: provider_expires_at
