databaseChangeLog:
  - changeSet:
      id: 010-harden-payment-activation-audit
      author: myvpn
      changes:
        - addColumn:
            tableName: payment_orders
            columns:
              - column: { name: activation_completed_at, type: "timestamp(6) with time zone" }
        - addColumn:
            tableName: vpn_accesses
            columns:
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - sql:
            sql: >
              UPDATE payment_orders
              SET activation_completed_at = updated_at
              WHERE activation_status = 'ACTIVATED'
                AND activation_completed_at IS NULL
        - sql:
            sql: >
              ALTER TABLE payment_orders
              ADD CONSTRAINT chk_payment_orders_processing_claim
                CHECK (activation_status <> 'PROCESSING'
                  OR (activation_claim_token IS NOT NULL AND activation_lease_until IS NOT NULL)),
              ADD CONSTRAINT chk_payment_orders_activated_completed
                CHECK (activation_status <> 'ACTIVATED' OR activation_completed_at IS NOT NULL),
              ADD CONSTRAINT chk_payment_orders_retry_scheduled
                CHECK (activation_status <> 'RETRY_REQUIRED' OR next_activation_at IS NOT NULL)
      rollback:
        - sql:
            sql: >
              ALTER TABLE payment_orders
              DROP CONSTRAINT chk_payment_orders_retry_scheduled,
              DROP CONSTRAINT chk_payment_orders_activated_completed,
              DROP CONSTRAINT chk_payment_orders_processing_claim
        - dropColumn:
            tableName: vpn_accesses
            columnName: version
        - dropColumn:
            tableName: payment_orders
            columnName: activation_completed_at
