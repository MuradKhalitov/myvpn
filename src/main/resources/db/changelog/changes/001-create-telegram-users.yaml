databaseChangeLog:
  - changeSet:
      id: 001-create-telegram-users
      author: myvpn
      changes:
        - createTable:
            tableName: telegram_users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_telegram_users_telegram_id
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(32)
              - column:
                  name: first_name
                  type: varchar(64)
              - column:
                  name: last_name
                  type: varchar(64)
              - column:
                  name: role
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
