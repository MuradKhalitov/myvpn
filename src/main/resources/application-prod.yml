payment:
  provider: ${PAYMENT_PROVIDER:?PAYMENT_PROVIDER is required in production}
  allow-fake: ${PAYMENT_ALLOW_FAKE:false}
  activation:
    enabled: ${PAYMENT_ACTIVATION_ENABLED:true}
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:}
    secret-key: ${YOOKASSA_SECRET_KEY:}
    return-url: ${YOOKASSA_RETURN_URL:${PAYMENT_RETURN_URL:https://example.invalid/payment-return}}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${DB_HIKARI_VALIDATION_TIMEOUT:3000}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:1500000}
  mail:
    host: ${SMTP_HOST:?SMTP_HOST is required in production}

vpn:
  provider:
    type: ${VPN_PROVIDER_TYPE:?VPN_PROVIDER_TYPE is required in production}
    allow-fake: ${VPN_PROVIDER_ALLOW_FAKE:false}

auth:
  enabled: true
  email-from: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required in production}
  otp:
    pepper: ${AUTH_OTP_PEPPER:?AUTH_OTP_PEPPER is required in production}
  jwt:
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64:?AUTH_JWT_PRIVATE_KEY_BASE64 is required in production}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64:?AUTH_JWT_PUBLIC_KEY_BASE64 is required in production}
  refresh:
    pepper: ${AUTH_REFRESH_PEPPER:?AUTH_REFRESH_PEPPER is required in production}

sms:
  ru:
    enabled: ${SMS_RU_ENABLED:false}
    api-id: ${SMS_RU_API_ID:}
    base-url: ${SMS_RU_BASE_URL:https://sms.ru}
    connect-timeout: ${SMS_RU_CONNECT_TIMEOUT_MS:3000ms}
    read-timeout: ${SMS_RU_READ_TIMEOUT_MS:5000ms}
