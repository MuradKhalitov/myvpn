spring:
  application:
    name: myvpn
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  mail:
    host: ${SMTP_HOST:smtp.mail.ru}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:myvpn-otp@mail.ru}
    password: ${SMTP_PASSWORD:Je0KfQYm5hBCybza7rku}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web.reactive.function.client: WARN
    reactor.netty.http.client: WARN
    org.telegram: INFO

telegram:
  admin-ids: ${TELEGRAM_ADMIN_IDS:}
  bot-token: ${TELEGRAM_BOT_TOKEN:}

payment:
  provider: ${PAYMENT_PROVIDER:fake}
  pending-ttl: ${PAYMENT_PENDING_TTL:1h}
  return-url: ${PAYMENT_RETURN_URL:https://example.invalid/payment-return}
  allow-fake: ${PAYMENT_ALLOW_FAKE:false}
  telegram:
    provider-token: ${TELEGRAM_PAYMENT_PROVIDER_TOKEN:}
    currency: RUB
    pre-checkout-timeout: ${TELEGRAM_PAYMENT_PRE_CHECKOUT_TIMEOUT:9s}
    receipt-enabled: ${TELEGRAM_PAYMENT_RECEIPT_ENABLED:false}
    vat-code: ${TELEGRAM_PAYMENT_VAT_CODE:}
    receipt-contact: ${TELEGRAM_PAYMENT_RECEIPT_CONTACT:}
  yookassa:
    base-url: ${YOOKASSA_BASE_URL:https://api.yookassa.ru/v3}
    shop-id: ${YOOKASSA_SHOP_ID:}
    secret-key: ${YOOKASSA_SECRET_KEY:}
    return-url: ${YOOKASSA_RETURN_URL:${PAYMENT_RETURN_URL:https://example.invalid/payment-return}}
    webhook-enabled: ${YOOKASSA_WEBHOOK_ENABLED:false}
    connect-timeout: ${YOOKASSA_CONNECT_TIMEOUT:3s}
    read-timeout: ${YOOKASSA_READ_TIMEOUT:10s}
    retry-after-min: ${YOOKASSA_RETRY_AFTER_MIN:1s}
    retry-after-max: ${YOOKASSA_RETRY_AFTER_MAX:15m}
  verification:
    min-interval: ${PAYMENT_VERIFICATION_MIN_INTERVAL:5s}
    max-clock-skew: ${PAYMENT_MAX_CLOCK_SKEW:5m}
  activation:
    enabled: ${PAYMENT_ACTIVATION_ENABLED:false}
    fixed-delay: ${PAYMENT_ACTIVATION_FIXED_DELAY:10s}
    batch-size: ${PAYMENT_ACTIVATION_BATCH_SIZE:20}
    lease-duration: ${PAYMENT_ACTIVATION_LEASE_DURATION:2m}
    retry-delay: ${PAYMENT_ACTIVATION_RETRY_DELAY:30s}
    max-attempts: ${PAYMENT_ACTIVATION_MAX_ATTEMPTS:5}

vpn:
  free:
    traffic-limit-bytes: ${VPN_FREE_TRAFFIC_LIMIT_BYTES:5368709120}
    quota-period-days: ${VPN_FREE_QUOTA_PERIOD_DAYS:30}
    # 3x-ui's server-side meaning must be verified in staging; kept explicit.
    premium-unlimited-total-gb: ${VPN_PREMIUM_UNLIMITED_TOTAL_GB:0}
  delivery:
    enabled: ${VPN_DELIVERY_ENABLED:false}
    batch-size: ${VPN_DELIVERY_BATCH_SIZE:10}
    fixed-delay: ${VPN_DELIVERY_FIXED_DELAY:5s}
    lease-duration: ${VPN_DELIVERY_LEASE_DURATION:2m}
    max-attempts: ${VPN_DELIVERY_MAX_ATTEMPTS:5}
    retry-initial-delay: ${VPN_DELIVERY_RETRY_INITIAL_DELAY:5s}
    retry-max-delay: ${VPN_DELIVERY_RETRY_MAX_DELAY:5m}
  provider:
    type: ${VPN_PROVIDER_TYPE:fake}
    allow-fake: ${VPN_PROVIDER_ALLOW_FAKE:false}
  three-x-ui:
    base-url: ${THREEXUI_BASE_URL:}
    web-base-path: ${THREEXUI_WEB_BASE_PATH:}
    username: ${THREEXUI_USERNAME:}
    password: ${THREEXUI_PASSWORD:}
    inbound-id: ${THREEXUI_INBOUND_ID:0}
    public-host: ${THREEXUI_PUBLIC_HOST:}
    public-port-override: ${THREEXUI_PUBLIC_PORT_OVERRIDE:}
    connect-timeout: ${THREEXUI_CONNECT_TIMEOUT:5s}
    read-timeout: ${THREEXUI_READ_TIMEOUT:10s}
    max-mutation-attempts: ${THREEXUI_MAX_MUTATION_ATTEMPTS:3}
    max-requests-per-operation: ${THREEXUI_MAX_REQUESTS_PER_OPERATION:8}
    retry-initial-delay: ${THREEXUI_RETRY_INITIAL_DELAY:1s}
    retry-max-delay: ${THREEXUI_RETRY_MAX_DELAY:8s}
  lifecycle:
    expiration-check-delay: 60000
    configuration-cleanup-delay: 3600000
    pending-recovery-delay: 60000

auth:
  enabled: ${AUTH_ENABLED:false}
  email-from: ${AUTH_EMAIL_FROM:}
  otp:
    ttl: ${AUTH_OTP_TTL:5m}
    resend-cooldown: ${AUTH_OTP_RESEND_COOLDOWN:60s}
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    pepper: ${AUTH_OTP_PEPPER:}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.myvpn.local}
    audience: ${AUTH_JWT_AUDIENCE:myvpn-android}
    access-ttl: ${AUTH_JWT_ACCESS_TTL:15m}
    key-id: ${AUTH_JWT_KEY_ID:myvpn-1}
    private-key-base64: ${AUTH_JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${AUTH_JWT_PUBLIC_KEY_BASE64:}
  refresh:
    ttl: ${AUTH_REFRESH_TTL:30d}
    pepper: ${AUTH_REFRESH_PEPPER:}

security:
  device:
    secret-pepper: ${SECURITY_DEVICE_SECRET_PEPPER:}
